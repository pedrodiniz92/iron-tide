<body>
<h1>QUANTIZED TOON RAMP — ASSET SHEET</h1>
<div class="sub">Every game asset, side by side: <b>NOW</b> = how it looks today (flat single neon color + glow, no outlines) · <b>CEL</b> = the chosen style (3 quantized hue-shifted bands, specular crescent, pale rim, fat inverted-hull ink outline). Canvas 2D at in-game scale.</div>
<div id="sheet"></div>

<script>
const INK = '#0d0d14';
function toward(h, target, deg){
  const d = ((target - h + 540) % 360) - 180;
  return h + Math.sign(d) * Math.min(Math.abs(d), deg);
}
function hslCss(h, s, l){ return `hsl(${((h%360)+360)%360}, ${Math.max(0,Math.min(100,s))}%, ${Math.max(0,Math.min(100,l))}%)`; }
function hexToHsl(hex){
  const n = hex.replace('#','');
  const r = parseInt(n.slice(0,2),16)/255, g = parseInt(n.slice(2,4),16)/255, b = parseInt(n.slice(4,6),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h = 0, s = 0, l = (max+min)/2;
  if(max !== min){
    const d = max-min;
    s = l > 0.5 ? d/(2-max-min) : d/(max+min);
    if(max===r) h = ((g-b)/d + (g<b?6:0));
    else if(max===g) h = (b-r)/d + 2;
    else h = (r-g)/d + 4;
    h *= 60;
  }
  return [h, s*100, l*100];
}
function ramp(hex){
  const [h, s, l] = hexToHsl(hex);
  return {
    lit: hslCss(toward(h, 55, 8),  s*0.95, Math.min(88, l+11)),
    mid: hslCss(h, s, l),
    lo:  hslCss(toward(h, 265, 20), s*0.8, Math.max(12, l-20)),
    hi:  hslCss(toward(h, 55, 16), s*0.62, Math.min(92, l+24)),
  };
}
// the chosen style: quantized bands + specular crescent + rim + fat inverted-hull ink
function toon(ctx, shape, bb, hex, opts={}){
  const r = ramp(hex);
  const lw = opts.lw || 3, R = bb.w * 1.25;
  const lx = bb.x + bb.w*0.28, ly = bb.y + bb.h*0.2;
  shape(ctx);
  ctx.fillStyle = r.mid; ctx.fill();
  ctx.save(); shape(ctx); ctx.clip();
  const lx2 = lx, ly2 = ly;
  const g = ctx.createRadialGradient(lx2, ly2, 2, lx2, ly2, R);
  g.addColorStop(0, r.lit);   g.addColorStop(0.4, r.lit);
  g.addColorStop(0.44, r.mid); g.addColorStop(0.68, r.mid);
  g.addColorStop(0.72, r.lo); g.addColorStop(1, r.lo);
  ctx.fillStyle = g; ctx.fillRect(bb.x-2, bb.y-2, bb.w+4, bb.h+4);
  ctx.beginPath();
  ctx.arc(lx2 + bb.w*0.06, ly2 + bb.h*0.14, bb.w*0.34, Math.PI*1.05, Math.PI*1.75);
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.translate(1.8, 1.8);
  shape(ctx); ctx.strokeStyle = r.hi; ctx.lineWidth = lw + 0.4; ctx.stroke();
  ctx.restore();
  shape(ctx); ctx.lineJoin='round'; ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.stroke();
  return r;
}
function ink(ctx, lw=2){ ctx.lineJoin='round'; ctx.lineWidth=lw; ctx.strokeStyle=INK; ctx.stroke(); }
// "what it's like now": flat single color + neon glow, no outlines, no shading
let MODE = 'cel';
function flat(ctx, shape, bb, hex){
  ctx.save();
  ctx.shadowColor = hex; ctx.shadowBlur = 7;
  shape(ctx); ctx.fillStyle = hex; ctx.fill();
  ctx.restore();
}
function paint(ctx, shape, bb, hex, opts){
  if(MODE === 'cel') toon(ctx, shape, bb, hex, opts);
  else flat(ctx, shape, bb, hex);
}

function eyes(ctx, pts, r=2.6){
  ctx.fillStyle=INK;
  pts.forEach(p=>{ ctx.beginPath(); ctx.arc(p[0],p[1],r,0,Math.PI*2); ctx.fill(); });
}
function bigEyes(ctx, pts, r=3){
  ctx.fillStyle=INK;
  pts.forEach(p=>{ ctx.beginPath(); ctx.arc(p[0],p[1],r,0,Math.PI*2); ctx.fill(); });
}

// ---------- sheet ----------
const sheet = document.getElementById('sheet');
function row(title, items){
  const h = document.createElement('h2'); h.textContent = title; sheet.appendChild(h);
  const r = document.createElement('div'); r.className='row'; sheet.appendChild(r);
  items.forEach(([cap, draw])=>{
    const d = document.createElement('div'); d.className='cell';
    const duo = document.createElement('div'); duo.className='duo';
    [ ['NOW','now'], ['CEL','cel'] ].forEach(([tag, mode])=>{
      const col = document.createElement('div');
      const t = document.createElement('div');
      t.className = 'tag' + (mode==='cel' ? ' celtag' : '');
      t.textContent = tag;
      const c = document.createElement('canvas'); c.width=130; c.height=100;
      col.appendChild(t); col.appendChild(c); duo.appendChild(col);
      const ctx = c.getContext('2d');
      MODE = mode;
      ctx.save(); ctx.translate(65,50); draw(ctx); ctx.restore();
      MODE = 'cel';
    });
    d.appendChild(duo);
    const p = document.createElement('div'); p.className='cap'; p.textContent=cap;
    d.appendChild(p); r.appendChild(d);
  });
}
function star(ctx, r){
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4, ri=i%2?r*0.5:r;
    ctx.lineTo(Math.cos(a)*ri, Math.sin(a)*ri);
  }
  ctx.closePath();
}
function flame(ctx){
  const g = ctx.createLinearGradient(0,8,0,26);
  g.addColorStop(0,'#bfe9ff'); g.addColorStop(1,'rgba(120,190,255,0)');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.moveTo(-5,8); ctx.lineTo(0,26); ctx.lineTo(5,8); ctx.closePath(); ctx.fill();
}
function powerBox(ctx, letter, hex){
  const bb = {x:-12,y:-12,w:24,h:24};
  const shape = (c)=>{ c.beginPath(); c.moveTo(-12,-8); c.arc(-8,-8,4,Math.PI,Math.PI*1.5);
    c.arc(8,-8,4,Math.PI*1.5,0); c.arc(8,8,4,0,Math.PI*0.5); c.arc(-8,8,4,Math.PI*0.5,Math.PI);
    c.closePath(); };
  const r = paint(ctx, shape, bb, hex);
  ctx.fillStyle=INK; ctx.font='bold 15px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(letter,0,1);
}

let PLAYING = true;
const animators = [];
function insertPlayCtl(){
  const ctl = document.createElement('div');
  ctl.id = 'playctl';
  ctl.style.cssText = 'margin:16px 0';
  ctl.innerHTML = '<button id="playbtn" style="background:#1b2145;color:#e8ecff;border:1px solid #3c4477;border-radius:6px;padding:8px 16px;font:13px system-ui,monospace;cursor:pointer">⏸ Pause animations</button>'
    + '<span style="color:#98a3c8;font-size:11px;margin-left:8px">paused = static pre-animation poses (applies to every animated row)</span>';
  sheet.appendChild(ctl);
  ctl.querySelector('#playbtn').addEventListener('click', (e)=>{
    PLAYING = !PLAYING;
    e.currentTarget.textContent = PLAYING ? '⏸ Pause animations' : '▶ Play animations';
  });
}
function animRow(title, items){
  const h = document.createElement('h2'); h.textContent = title; sheet.appendChild(h);
  const r = document.createElement('div'); r.className='row'; sheet.appendChild(r);
  items.forEach(([cap, frame])=>{
    const d = document.createElement('div'); d.className='cell';
    const duo = document.createElement('div'); duo.className='duo';
    [['NOW','now'],['CEL','cel']].forEach(([tag, mode])=>{
      const col = document.createElement('div');
      const tEl = document.createElement('div'); tEl.className='tag'+(mode==='cel'?' celtag':''); tEl.textContent=tag;
      const c = document.createElement('canvas'); c.width=130; c.height=100;
      col.appendChild(tEl); col.appendChild(c); duo.appendChild(col);
      animators.push({ ctx: c.getContext('2d'), frame, mode, start: performance.now() });
    });
    d.appendChild(duo);
    const p = document.createElement('div'); p.className='cap'; p.textContent=cap;
    d.appendChild(p); r.appendChild(d);
  });
}
function animLoop(now){
  animators.forEach((a)=>{
    const t = PLAYING ? ((now - a.start)/1000) % 1.1 : 0;
    MODE = a.mode;
    a.ctx.clearRect(0,0,130,100);
    a.ctx.save(); a.ctx.translate(65,50); a.frame(a.ctx, t); a.ctx.restore();
    MODE = 'cel';
  });
  requestAnimationFrame(animLoop);
}
requestAnimationFrame(animLoop);

// ---------- SFX previews (Web Audio synth, same approach as js/audio.js) ----------
let AC = null;
function ac(){ if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }
function tone(o){
  const a = ac(), t0 = a.currentTime + (o.delay || 0);
  const osc = a.createOscillator(), g = a.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(o.f0, t0);
  if (o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f1), t0 + o.dur);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(o.vol || 0.18, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
  let node = osc;
  if (o.tremolo){
    const lfo = a.createOscillator(), lg = a.createGain();
    lfo.frequency.value = o.tremolo; lg.gain.value = 0.09;
    lfo.connect(lg); lg.connect(g.gain);
    lfo.start(t0); lfo.stop(t0 + o.dur + 0.05);
  }
  if (o.filter){
    const f = a.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(o.filter, t0);
    f.frequency.exponentialRampToValueAtTime(Math.max(60,o.filter*4), t0 + o.dur);
    node = osc.connect(f) && f;
  }
  node.connect(g); g.connect(a.destination);
  osc.start(t0); osc.stop(t0 + o.dur + 0.05);
}

function dyingDots(c, p, color){
  c.save();
  c.globalAlpha = 1 - p;
  c.fillStyle = color;
  const size = 3 - 2*p;
  for (let i=0;i<4;i+=1){
    c.save();
    c.rotate(i*1.57 + 0.4);
    c.fillRect(4 + p*14, -size/2, size, size);
    c.restore();
  }
  c.restore();
}
