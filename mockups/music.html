      let ctx = null;
      let master = null;
      let timer = null;
      let step = 0;
      let nextTime = 0;
      let current = -1;

      function initAudio() {
        if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain();
        master.gain.value = Number(vol.value) / 100 * 0.5;
        master.connect(ctx.destination);
      }

      function midiHz(m) { return 440 * Math.pow(2, (m - 69) / 12); }

      function tone(midi, when, duration, type, gain) {
        const osc = ctx.createOscillator();
        const amp = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(midiHz(midi), when);
        amp.gain.setValueAtTime(0.0001, when);
        amp.gain.linearRampToValueAtTime(gain, when + 0.008);
        amp.gain.exponentialRampToValueAtTime(0.0001, when + duration);
        osc.connect(amp);
        amp.connect(master);
        osc.start(when);
        osc.stop(when + duration + 0.02);
      }

      function noise(when, duration, gain, hz) {
        const frames = Math.max(1, Math.floor(ctx.sampleRate * duration));
        const buf = ctx.createBuffer(1, frames, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < frames; i += 1) data[i] = (Math.random() * 2 - 1) * (1 - i / frames);
        const src = ctx.createBufferSource();
        const filt = ctx.createBiquadFilter();
        const amp = ctx.createGain();
        src.buffer = buf;
        filt.type = "highpass";
        filt.frequency.value = hz;
        amp.gain.setValueAtTime(gain, when);
        amp.gain.exponentialRampToValueAtTime(0.0001, when + duration);
        src.connect(filt);
        filt.connect(amp);
        amp.connect(master);
        src.start(when);
        src.stop(when + duration + 0.02);
      }

      function kick(when) {
        const osc = ctx.createOscillator();
        const amp = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(150, when);
        osc.frequency.exponentialRampToValueAtTime(42, when + 0.13);
        amp.gain.setValueAtTime(0.16, when);
        amp.gain.exponentialRampToValueAtTime(0.0001, when + 0.16);
        osc.connect(amp);
        amp.connect(master);
        osc.start(when);
        osc.stop(when + 0.18);
      }

      function scheduleStep(track, s, when) {
        const lead = track.melody[s % track.melody.length];
        const low = track.bass[s % track.bass.length];
        const pulse = track.arp[s % track.arp.length];
        if (lead) tone(lead, when, 0.1, "square", 0.078);
        if (low) tone(low, when, 0.13, "sawtooth", 0.135);
        if (pulse) tone(pulse, when, 0.055, "square", 0.044);
        if (s % 2 === 0) noise(when, 0.025, 0.062, 10500);
        if (s % 16 === 0 || s % 16 === 6) kick(when);
        if (s % 16 === 4 || s % 16 === 12) noise(when, 0.13, 0.13, 2200);
        if (s % 16 === 14) noise(when, 0.24, 0.09, 4800);
      }

      function stop() {
        if (timer) clearInterval(timer);
        timer = null;
        current = -1;
        document.querySelectorAll("button.track").forEach((b) => b.classList.remove("playing"));
        now.textContent = "silent";
      }

      function play(index) {
        initAudio();
        if (current === index) { stop(); return; }
        stop();
        const track = TRACKS[index];
        const stepDur = 60 / track.bpm / 4;
        step = 0;
        nextTime = ctx.currentTime + 0.05;
        current = index;
        document.querySelectorAll("button.track")[index].classList.add("playing");
        now.textContent = track.name;
        timer = setInterval(() => {
          while (nextTime < ctx.currentTime + 0.15) {
            scheduleStep(track, step, nextTime);
            step = (step + 1) % 64;
            nextTime += stepDur;
          }
        }, 40);
      }

      const tracksEl = document.getElementById("tracks");
      const now = document.getElementById("now");
      const vol = document.getElementById("vol");

      TRACKS.forEach((track, index) => {
        const b = document.createElement("button");
        b.className = "track";
        b.innerHTML = `${track.name}<div class="meta">${track.bpm} BPM - click to play/stop</div>`;
        b.addEventListener("click", () => play(index));
        tracksEl.appendChild(b);
      });

      document.getElementById("stop").addEventListener("click", stop);
      vol.addEventListener("input", () => { if (master) master.gain.value = Number(vol.value) / 100 * 0.5; });
      document.addEventListener("keydown", (e) => {
        const n = Number(e.key);
        if (n >= 1 && n <= TRACKS.length) play(n - 1);
      });
