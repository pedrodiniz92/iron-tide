<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Boss bomb visuals - options</title>
    <style>
      body { background: #000; color: #cfe8d4; font: 14px 'Courier New', monospace; margin: 24px; }
      h1 { color: #66ff66; font-size: 18px; }
      p.hint { color: #6a8fa5; font-size: 12px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, 330px); gap: 18px; }
      .card { border: 1px solid #1c3a1c; padding: 10px; text-align: center; }
      .card canvas { background: #000; display: block; margin: 0 auto; }
      .name { color: #ffe066; margin-top: 8px; }
      .note { color: #6a8fa5; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>ENEMY BOMB VISUALS (yellow = SKULL/TURTLE, green = VIPER/SPINE)</h1>
    <p class="hint">Bombs fall on a loop; the last second before detonation is shown as the low part of the arc.</p>
    <div class="grid" id="grid"></div>
    <script>
      const YELLOW = "#ffe066";
      const GREEN = "#62ffa1";

      const OPTIONS = [
        { name: "1. CURRENT", note: "dashed radius ring + halo (the one that reads as hp)", draw: currentBomb },
        { name: "2. PLAIN ORB", note: "clean glowing core + fuse spark, no rings", draw: orbBomb },
        { name: "3. COMET", note: "core with a fading speed trail", draw: cometBomb },
        { name: "4. PULSE", note: "core emits expanding pulse rings", draw: pulseBomb },
        { name: "5. BLINK", note: "dark shell, red core blinking faster near detonation", draw: blinkBomb },
        { name: "6. MINIMAL", note: "small hard-edged core, no effects at all", draw: minimalBomb },
        { name: "7. PLAYER BOMB", note: "same look as the bomb the player fires", draw: playerStyleBomb }
      ];

      function playerStyleBomb(g, x, y) {
        for (let i = 5; i >= 1; i -= 1) {
          const k = 1 - i / 6;
          g.fillStyle = `rgba(255, 153, 0, ${0.55 * k})`;
          g.beginPath();
          g.arc(x, y - i * 10, 4 + k * 5, 0, Math.PI * 2);
          g.fill();
        }
        g.fillStyle = "rgba(255, 224, 102, 0.24)";
        g.beginPath();
        g.arc(x, y, 16, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = "#ffe066";
        g.beginPath();
        g.arc(x, y, 8, 0, Math.PI * 2);
        g.fill();
      }

      function currentBomb(g, x, y, col, t) {
        g.strokeStyle = col;
        g.lineWidth = 3;
        g.setLineDash([7, 6]);
        g.beginPath();
        g.arc(x, y, 30, 0, Math.PI * 2);
        g.stroke();
        g.setLineDash([]);
        g.globalAlpha = 0.32;
        g.fillStyle = col;
        g.beginPath();
        g.arc(x, y, 21, 0, Math.PI * 2);
        g.fill();
        g.globalAlpha = 1;
        g.beginPath();
        g.arc(x, y, 11, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = "#ffe066";
        g.beginPath();
        g.arc(x - 2, y - 2, 3.5, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = "#ff6600";
        g.fillRect(x - 2, y + 11, 4, 8);
        g.lineWidth = 1;
      }

      function orbBomb(g, x, y, col) {
        const grad = g.createRadialGradient(x, y, 2, x, y, 24);
        grad.addColorStop(0, col);
        grad.addColorStop(0.45, col + "55");
        grad.addColorStop(1, "rgba(0,0,0,0)");
        g.fillStyle = grad;
        g.beginPath();
        g.arc(x, y, 24, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = col;
        g.beginPath();
        g.arc(x, y, 10, 0, Math.PI * 2);
        g.fill();
        g.strokeStyle = col;
        g.lineWidth = 2;
        g.beginPath();
        g.moveTo(x + 5, y - 8);
        g.lineTo(x + 10, y - 15);
        g.stroke();
        g.fillStyle = "#fff";
        g.beginPath();
        g.arc(x + 10, y - 16, 2, 0, Math.PI * 2);
        g.fill();
        g.lineWidth = 1;
      }

      function cometBomb(g, x, y, col) {
        for (let i = 6; i >= 1; i -= 1) {
          g.globalAlpha = 0.06 * (7 - i);
          g.fillStyle = col;
          g.beginPath();
          g.arc(x, y - i * 9, 10 - i, 0, Math.PI * 2);
          g.fill();
        }
        g.globalAlpha = 1;
        g.fillStyle = col;
        g.beginPath();
        g.arc(x, y, 9, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = "#fff";
        g.beginPath();
        g.arc(x - 2, y - 2, 3, 0, Math.PI * 2);
        g.fill();
      }

      function pulseBomb(g, x, y, col, t) {
        for (let i = 0; i < 2; i += 1) {
          const phase = (t * 1.5 + i / 2) % 1;
          g.globalAlpha = 1 - phase;
          g.strokeStyle = col;
          g.lineWidth = 3;
          g.beginPath();
          g.arc(x, y, 9 + phase * 20, 0, Math.PI * 2);
          g.stroke();
        }
        g.globalAlpha = 1;
        g.fillStyle = col;
        g.beginPath();
        g.arc(x, y, 8, 0, Math.PI * 2);
        g.fill();
        g.lineWidth = 1;
      }

      function blinkBomb(g, x, y, col, t, danger) {
        g.fillStyle = "#1a1a22";
        g.strokeStyle = col;
        g.lineWidth = 3;
        g.beginPath();
        g.arc(x, y, 13, 0, Math.PI * 2);
        g.fill();
        g.stroke();
        const rate = 5 + danger * 22;
        const on = Math.sin(t * rate) > 0;
        g.fillStyle = on ? "#ff3366" : "#661020";
        g.beginPath();
        g.arc(x, y, 5, 0, Math.PI * 2);
        g.fill();
        g.lineWidth = 1;
      }

      function minimalBomb(g, x, y, col) {
        g.fillStyle = col;
        g.beginPath();
        g.arc(x, y, 7, 0, Math.PI * 2);
        g.fill();
        g.strokeStyle = "#fff";
        g.lineWidth = 2;
        g.beginPath();
        g.arc(x, y, 7, 0, Math.PI * 2);
        g.stroke();
        g.lineWidth = 1;
      }

      const grid = document.getElementById("grid");
      const cards = OPTIONS.map((opt) => {
        const card = document.createElement("div");
        card.className = "card";
        const cv = document.createElement("canvas");
        cv.width = 300;
        cv.height = 260;
        const label = document.createElement("div");
        label.className = "name";
        label.textContent = opt.name;
        const note = document.createElement("div");
        note.className = "note";
        note.textContent = opt.note;
        card.appendChild(cv);
        card.appendChild(label);
        card.appendChild(note);
        grid.appendChild(card);
        return { cv, g: cv.getContext("2d"), draw: opt.draw };
      });

      function loop(ts) {
        const t = ts / 1000;
        cards.forEach((card) => {
          card.g.fillStyle = "#000";
          card.g.fillRect(0, 0, 300, 260);
          card.g.strokeStyle = "#246b24";
          card.g.beginPath();
          card.g.moveTo(0, 230);
          card.g.lineTo(300, 230);
          card.g.stroke();
          const fall = (tt) => {
            const y = ((tt * 95) % 260) - 10;
            const danger = Math.max(0, (y - 150) / 70);
            return { y, danger };
          };
          const a = fall(t);
          const b = fall(t + 1.3);
          card.draw(card.g, 80, a.y, YELLOW, t, a.danger);
          card.draw(card.g, 210, b.y, GREEN, t + 1.3, b.danger);
        });
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
