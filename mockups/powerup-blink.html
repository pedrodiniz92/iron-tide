<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Powerup drop expiry blink options</title>
    <style>
      body { background: #000; color: #cfe8d4; font: 14px 'Courier New', monospace; margin: 24px; }
      h1 { color: #66ff66; font-size: 18px; margin-bottom: 6px; }
      p.hint { color: #6a8fa5; font-size: 12px; margin-top: 0; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, 250px); gap: 18px; }
      .card { border: 1px solid #1c3a1c; padding: 10px; text-align: center; }
      .card { position: relative; }
      canvas { background: #000; display: block; margin: 0 auto; }
      .overlay { position: absolute; left: 10px; top: 10px; background: transparent; pointer-events: none; z-index: 2; }
      .name { color: #ffe066; margin-top: 8px; }
      .note { color: #6a8fa5; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>POWERUP DROP EXPIRY FLICKER - ALL POWERUPS</h1>
    <p class="hint">Loop: 6s drop, last 1.8s is the expiry warning. Black hull parts stay opaque.</p>
    <div class="grid" id="grid"></div>
    <script src="powerup-blink.bundle.js"></script>
  </body>
</html>
