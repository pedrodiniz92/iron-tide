<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Powerup drop expiry blink options</title>
    <style>
      body { background: #000; color: #cfe8d4; font: 14px 'Courier New', monospace; margin: 24px; }
      h1 { color: #66ff66; font-size: 18px; margin-bottom: 6px; }
      p.hint { color: #6a8fa5; font-size: 12px; margin-top: 0; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, 250px); gap: 18px; }
      .card { border: 1px solid #1c3a1c; padding: 10px; text-align: center; }
      canvas { background: #000; display: block; margin: 0 auto; }
      .name { color: #ffe066; margin-top: 8px; }
      .note { color: #6a8fa5; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>POWERUP DROP EXPIRY BLINK - TIME WARP (Z)</h1>
    <p class="hint">Loop: 6s drop, last 1.8s is the expiry warning. All cards show the same drop.</p>
    <div class="grid" id="grid"></div>
    <script>
      const DROP_TTL = 6;
      const WARN = 1.8;
      const COLOR = "#bf9cff";

      const OPTIONS = [
        { name: "1. CURRENT SOFT PULSE", note: "alpha fades in and out, no hard blink", draw: softPulse },
        { name: "2. HARD BLINK", note: "visible / hidden, classic arcade warning", draw: hardBlink },
        { name: "3. BLINK + SHRINK", note: "hard blink and drop shrinks as it expires", draw: blinkShrink },
        { name: "4. BLINK + TIMER RING", note: "hard blink with a purple countdown ring", draw: blinkRing },
        { name: "5. FLASH OUTLINE", note: "drop stays solid, white outline flashes", draw: flashOutline }
      ];

      function drawGameBoxPath(g, cx, cy, targetW, color, glow, outline) {
        const bb = { x: -12, y: -12, w: 24, h: 24 };
        const scale = targetW / bb.w;
        g.save();
        g.translate(cx - (bb.x + bb.w / 2) * scale, cy - (bb.y + bb.h / 2) * scale);
        g.scale(scale, scale);
        g.shadowColor = color;
        g.shadowBlur = glow;
        g.beginPath();
        g.moveTo(-12, -8);
        g.arc(-8, -8, 4, Math.PI, Math.PI * 1.5);
        g.arc(8, -8, 4, Math.PI * 1.5, 0);
        g.arc(8, 8, 4, 0, Math.PI * 0.5);
        g.arc(-8, 8, 4, Math.PI * 0.5, Math.PI);
        g.closePath();
        g.fillStyle = color;
        g.fill();
        if (outline) {
          g.shadowBlur = 0;
          g.strokeStyle = outline;
          g.lineWidth = 3 / scale;
          g.stroke();
        }
        g.restore();
      }

      function drawDrop(g, x, y, alpha, scale, outline) {
        g.save();
        g.globalAlpha = alpha;
        drawGameBoxPath(g, x, y, 26 * scale, COLOR, 7, outline);
        g.shadowColor = COLOR;
        g.shadowBlur = 16;
        g.fillStyle = "#0d0d14";
        g.font = `bold ${Math.round(15 * scale)}px 'Courier New', monospace`;
        g.textAlign = "center";
        g.fillText("Z", x, y + 5 * scale);
        g.textAlign = "left";
        g.restore();
      }

      function softPulse(g, x, y, t, progress) {
        const alpha = progress < WARN ? 1 : Math.max(0.25, 0.55 + Math.sin(t * 15) * 0.25);
        drawDrop(g, x, y, alpha, 1);
      }

      function hardBlink(g, x, y, t, progress) {
        const visible = progress < WARN || Math.sin(t * 18) > 0;
        drawDrop(g, x, y, visible ? 1 : 0.12, 1);
      }

      function blinkShrink(g, x, y, t, progress) {
        const visible = progress < WARN || Math.sin(t * 18) > 0;
        const scale = progress < WARN ? 1 : 0.72 + 0.28 * (1 - progress / WARN);
        drawDrop(g, x, y, visible ? 1 : 0.12, scale);
      }

      function blinkRing(g, x, y, t, progress) {
        const visible = progress < WARN || Math.sin(t * 18) > 0;
        drawDrop(g, x, y, visible ? 1 : 0.12, 1);
        g.save();
        g.strokeStyle = COLOR;
        g.lineWidth = 3;
        g.beginPath();
        g.arc(x, y, 24, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - progress / DROP_TTL));
        g.stroke();
        g.restore();
      }

      function flashOutline(g, x, y, t, progress) {
        const flash = progress < WARN && Math.sin(t * 18) > 0;
        drawDrop(g, x, y, 1, 1, flash ? "#ffffff" : null);
      }

      function buildCards() {
        const grid = document.getElementById("grid");
        OPTIONS.forEach((option) => {
          const card = document.createElement("div");
          card.className = "card";
          const canvas = document.createElement("canvas");
          canvas.width = 180;
          canvas.height = 120;
          const name = document.createElement("div");
          name.className = "name";
          name.textContent = option.name;
          const note = document.createElement("div");
          note.className = "note";
          note.textContent = option.note;
          card.append(canvas, name, note);
          grid.appendChild(card);
          option.canvas = canvas;
          option.g = canvas.getContext("2d");
        });
      }

      function frame(now) {
        const t = now / 1000;
        const progress = t % DROP_TTL;
        OPTIONS.forEach((option) => {
          const g = option.g;
          g.clearRect(0, 0, option.canvas.width, option.canvas.height);
          g.fillStyle = "#111";
          g.fillRect(0, 0, option.canvas.width, option.canvas.height);
          option.draw(g, option.canvas.width / 2, option.canvas.height / 2, t, progress);
          g.fillStyle = "#6a8fa5";
          g.font = "10px 'Courier New', monospace";
          g.fillText(`TTL ${Math.max(0, DROP_TTL - progress).toFixed(1)}s`, 8, 14);
        });
        requestAnimationFrame(frame);
      }

      buildCards();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
