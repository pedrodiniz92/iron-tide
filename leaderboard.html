<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IRON TIDE — Leaderboard</title>
    <style>
      body { margin: 0; background: #0b0c14; color: #e8ecff; font: 14px 'Courier New', monospace; padding: 30px; }
      h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: .1em; }
      .sub { color: #98a3c8; margin-bottom: 18px; }
      table { border-collapse: collapse; min-width: 560px; }
      th, td { padding: 6px 14px; text-align: left; border-bottom: 1px solid #23263f; }
      th { color: #9ae6ff; font-size: 11px; letter-spacing: .1em; }
      tr.me td { color: #ffe066; }
      td.t { color: #9fffc9; }
      a.btn {
        display: inline-block; margin-top: 18px;
        background: #171b36; border: 1px solid #454a7a; border-radius: 999px;
        color: #9ae6ff; font: 12px 'Courier New', monospace; letter-spacing: .08em;
        padding: 8px 18px; cursor: pointer; text-decoration: none;
      }
      a.btn:hover { border-color: #9ae6ff; }
      #empty { color: #6f7aa5; }
    </style>
  </head>
  <body>
    <h1>IRON TIDE — <span data-i18n="Leaderboard">Leaderboard</span></h1>
    <div class="sub" data-i18n="Beat the ABYSSAL SQUID on wave 9 to enter. Fewer seconds wins ties.">Beat the ABYSSAL SQUID on wave 9 to enter. Fewer seconds wins ties.</div>
    <table>
      <thead><tr><th>#</th><th data-i18n="Pilot">Pilot</th><th data-i18n="Score">Score</th><th data-i18n="Time">Time</th><th data-i18n="Date">Date</th><th data-i18n="Result">Result</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty"></div>
    <a class="btn" href="index.html" data-i18n="BACK TO GAME">BACK TO GAME</a>
    <script>
      const LB_I18N = {
        pt: {
          "Leaderboard": "Ranking",
          "Beat the ABYSSAL SQUID on wave 9 to enter. Fewer seconds wins ties.": "Derrote a LULA ABISSAL na onda 9 para entrar. Em empate, vence quem gastou menos segundos.",
          "Pilot": "Piloto", "Score": "Pontos", "Time": "Tempo", "Date": "Data", "Result": "Resultado",
          "BACK TO GAME": "VOLTAR AO JOGO",
          "GAME BEATEN": "JOGO ZERADO",
          "No runs recorded yet.": "Nenhuma pontuação registrada ainda."
        }
      };
      let LB_LANG = "en";
      try {
        const saved = localStorage.getItem("it25_lang");
        if (saved === "pt" || saved === "en") LB_LANG = saved;
        else if ((navigator.language || "").toLowerCase().startsWith("pt")) LB_LANG = "pt";
      } catch (e) {}
      function lt(key) { return (LB_I18N[LB_LANG] && LB_I18N[LB_LANG][key]) || key; }
      function lbApply() {
        document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = lt(el.getAttribute("data-i18n")); });
        document.documentElement.lang = LB_LANG === "pt" ? "pt-BR" : "en";
        lbBtn.innerHTML = "<b" + (LB_LANG === "en" ? "" : ' style="opacity:0.45"') + ">EN</b> | <b" + (LB_LANG === "pt" ? "" : ' style="opacity:0.45"') + ">PT</b>";
      }
      const lbBtn = document.createElement("button");
      lbBtn.style.cssText = "position:fixed;top:12px;right:16px;background:#171b36;border:1px solid #454a7a;border-radius:999px;color:#9ae6ff;font:12px 'Courier New',monospace;padding:6px 12px;cursor:pointer;";
      lbBtn.addEventListener("click", () => {
        LB_LANG = LB_LANG === "en" ? "pt" : "en";
        try { localStorage.setItem("it25_lang", LB_LANG); } catch (e) {}
        lbApply();
        render(loadScores());
      });
      document.body.appendChild(lbBtn);
      lbApply();
      const NAME_KEY = "it25_name";
      const SCORES_KEY = "it25_scores";
      try {
        if (!localStorage.getItem("scoresResetV3")) {
          localStorage.removeItem(SCORES_KEY);
          localStorage.setItem("scoresResetV3", "1");
        }
        if (!localStorage.getItem("scoresResetV4")) {
          localStorage.removeItem(SCORES_KEY);
          localStorage.setItem("scoresResetV4", "1");
        }
        if (!localStorage.getItem("scoresResetV5")) {
          localStorage.removeItem(SCORES_KEY);
          localStorage.setItem("scoresResetV5", "1");
        }
        if (!localStorage.getItem("scoresResetV10")) {
          localStorage.removeItem(SCORES_KEY);
          localStorage.setItem("scoresResetV10", "1");
        }
        if (!localStorage.getItem("scoresResetV11")) {
          localStorage.removeItem(SCORES_KEY);
          localStorage.setItem("scoresResetV11", "1");
        }
      } catch (e) {}
      function loadScores() {
        try { return JSON.parse(localStorage.getItem(SCORES_KEY) || "[]"); } catch (e) { return []; }
      }
      function formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return m + ":" + String(s).padStart(2, "0");
      }
      const me = (function () { try { return localStorage.getItem(NAME_KEY) || ""; } catch (e) { return ""; } })();
      const rows = document.getElementById("rows");
      function render(list) {
      rows.innerHTML = "";
      const empty = document.getElementById("empty");
      empty.textContent = "";
      list.forEach((entry, i) => {
        const tr = document.createElement("tr");
        if (entry.name.toUpperCase() === me.toUpperCase()) tr.className = "me";
        [i + 1, entry.name, entry.score, formatTime(entry.time), entry.date, entry.win ? lt("GAME BEATEN") : ""].forEach((value, c) => {
          const td = document.createElement("td");
          td.textContent = value;
          if (c === 3) td.className = "t";
          tr.appendChild(td);
        });
        rows.appendChild(tr);
      });
      if (!list.length) empty.textContent = lt("No runs recorded yet.");
      }
      render(loadScores());
      fetch("https://iron-tide-board.iron-tide-2-5.workers.dev/scores?v=" + Date.now())
        .then((r) => (r.ok ? r.json() : null))
        .then((d) => {
          if (d && Array.isArray(d.scores)) {
            try { localStorage.setItem(SCORES_KEY, JSON.stringify(d.scores.slice(0, 100))); } catch (e) {}
            render(d.scores);
          }
        })
        .catch(() => {});
    </script>
  </body>
</html>
